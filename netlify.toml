[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# الخريطة والأعلام ما تتغير كثير: نخليها بالكاش
[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
